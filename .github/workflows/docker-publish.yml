name: docker-publish

# Builds the Docker image and pushes it to GitHub Container Registry (ghcr.io).
# Runs automatically from release-please when a release is created, or manually
# from the Actions tab (Run workflow) to (re)publish an existing release tag.

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build, e.g. v1.2.3"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, e.g. v1.2.3"
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/matthornish/wunderlost

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Work out image tags
        id: tags
        run: |
          TAG="${{ inputs.tag }}"
          if ! [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Tag '$TAG' is not a vX.Y.Z release tag" >&2
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"; MINOR="${BASH_REMATCH[2]}"; PATCH="${BASH_REMATCH[3]}"
          {
            echo "list<<EOF"
            echo "${IMAGE}:latest"
            echo "${IMAGE}:${MAJOR}.${MINOR}.${PATCH}"
            echo "${IMAGE}:${MAJOR}.${MINOR}"
            echo "${IMAGE}:${MAJOR}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "version=${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Wunderlost
          cache-from: type=gha
          cache-to: type=gha,mode=max
