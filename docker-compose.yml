services:
  wunderlost:
    build: .
    image: wunderlost:latest
    container_name: wunderlost
    restart: unless-stopped
    user: "99:100"                    # Unraid nobody:users so it can write to appdata
    ports:
      - "3000:3000"
    environment:
      - TZ=America/New_York            # reminders + "Today" use this timezone
      - VAPID_SUBJECT=mailto:you@yourdomain.com   # must be a real-looking address or Apple push rejects it
      - ALLOW_REGISTRATION=false       # first account is always allowed (becomes admin); after that admin creates users
    volumes:
      - /mnt/user/appdata/wunderlost:/data
